[project]
name = "lab1"
version = "0.3.0"
description = "Лабораторная работа 1. Связь двух компьютеров"
readme = "README.md"
authors = [
    { name = "Di", email = "diana07.ko@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "brotli>=1.2.0",
    "ggwave>=0.4.3",
    "numpy>=2.5.4",
    "pyside6>=6.12.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
lab1 = "lab1.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
